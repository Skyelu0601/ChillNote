import groovy.json.JsonOutput

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "androidx.room"
}

def uploadKeystoreProperties = new Properties()
def uploadKeystorePropertiesFile = rootProject.file("keystore.properties")
if (uploadKeystorePropertiesFile.exists()) {
    uploadKeystorePropertiesFile.withInputStream { uploadKeystoreProperties.load(it) }
}
def uploadStoreFile = System.getenv("CHILLSCRIPT_UPLOAD_STORE_FILE") ?: uploadKeystoreProperties.getProperty("storeFile")
def uploadStorePassword = System.getenv("CHILLSCRIPT_UPLOAD_STORE_PASSWORD") ?: uploadKeystoreProperties.getProperty("storePassword")
def uploadKeyAlias = System.getenv("CHILLSCRIPT_UPLOAD_KEY_ALIAS") ?: uploadKeystoreProperties.getProperty("keyAlias")
def uploadKeyPassword = System.getenv("CHILLSCRIPT_UPLOAD_KEY_PASSWORD") ?: uploadKeystoreProperties.getProperty("keyPassword")
def hasUploadSigning = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it != null && !it.isBlank() }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def firebaseConfigValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: localProperties.getProperty(propertyName) ?: ""
}
def firebaseApiKey = firebaseConfigValue("CHILLSCRIPT_FIREBASE_API_KEY", "chillscript.firebase.apiKey")
def firebaseAppId = firebaseConfigValue("CHILLSCRIPT_FIREBASE_APP_ID", "chillscript.firebase.appId")
def firebaseProjectId = firebaseConfigValue("CHILLSCRIPT_FIREBASE_PROJECT_ID", "chillscript.firebase.projectId")
def firebaseSenderId = firebaseConfigValue("CHILLSCRIPT_FIREBASE_SENDER_ID", "chillscript.firebase.senderId")
def configuredAuthRedirectUri = firebaseConfigValue(
    "CHILLSCRIPT_ANDROID_AUTH_REDIRECT_URI", "chillscript.auth.redirectUri"
)
def authRedirectUri = configuredAuthRedirectUri?.trim()
if (!authRedirectUri) authRedirectUri = "chillscript://auth-callback"
def appReviewLoginEnabled = firebaseConfigValue(
    "CHILLSCRIPT_APP_REVIEW_LOGIN_ENABLED", "chillscript.appReview.loginEnabled"
).trim()
if (!appReviewLoginEnabled) appReviewLoginEnabled = "true"
def appReviewWhitelistEmails = firebaseConfigValue(
    "CHILLSCRIPT_APP_REVIEW_WHITELIST_EMAILS", "chillscript.appReview.whitelistEmails"
).trim()
if (!appReviewWhitelistEmails) appReviewWhitelistEmails = "androidreview@chillnoteai.com"
def appReviewVerificationCode = firebaseConfigValue(
    "CHILLSCRIPT_APP_REVIEW_VERIFICATION_CODE", "chillscript.appReview.verificationCode"
).trim()
if (!appReviewVerificationCode) appReviewVerificationCode = "202602"

room {
    schemaDirectory "$projectDir/schemas"
}

android {
    namespace "com.sponteoai.chillscript"
    compileSdk 36

    defaultConfig {
        applicationId "com.sponteoai.chillscript"
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName "1.2.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL", '"https://qsyhkpaeyzhjojdvbntq.supabase.co"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"sb_publishable_smWWadjejdbKYvmg3fidsg_41XPu70e"'
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", '"720828371402-scepfqqjt5ffir9kg9ob9c8tlhlblmv5.apps.googleusercontent.com"'
        buildConfigField "String", "AUTH_REDIRECT_URI", JsonOutput.toJson(authRedirectUri)
        buildConfigField "String", "FIREBASE_API_KEY", JsonOutput.toJson(firebaseApiKey)
        buildConfigField "String", "FIREBASE_APP_ID", JsonOutput.toJson(firebaseAppId)
        buildConfigField "String", "FIREBASE_PROJECT_ID", JsonOutput.toJson(firebaseProjectId)
        buildConfigField "String", "FIREBASE_SENDER_ID", JsonOutput.toJson(firebaseSenderId)
        buildConfigField "boolean", "APP_REVIEW_LOGIN_ENABLED", appReviewLoginEnabled.toBoolean().toString()
        buildConfigField "String", "APP_REVIEW_WHITELIST_EMAILS", JsonOutput.toJson(appReviewWhitelistEmails)
        buildConfigField "String", "APP_REVIEW_VERIFICATION_CODE", JsonOutput.toJson(appReviewVerificationCode)
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        if (hasUploadSigning) {
            releaseUpload {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.releaseUpload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Fails release packaging when the Google Play upload key is not configured."
    doLast {
        if (!hasUploadSigning) {
            throw new GradleException(
                "Release signing is not configured. Add android/keystore.properties or the " +
                    "CHILLSCRIPT_UPLOAD_* environment variables before building a Play bundle."
            )
        }
        def resolvedStoreFile = rootProject.file(uploadStoreFile)
        if (!resolvedStoreFile.isFile()) {
            throw new GradleException("Release upload keystore not found: ${resolvedStoreFile}")
        }
    }
}

tasks.matching { it.name == "bundleRelease" || it.name == "assembleRelease" }.configureEach {
    dependsOn(verifyReleaseSigning)
}

