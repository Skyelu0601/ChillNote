<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <filter id="wordmarkShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17211F" flood-opacity="0.12"/>
    </filter>
  </defs>
  <image x="0" y="0" width="1024" height="500"
         xlink:href="feature-graphic-warm-background-v2.png"
         preserveAspectRatio="xMidYMid slice"/>
  <!-- Exact in-app ChillScript wordmark; kept inside the feature graphic's central safe area. -->
  <image x="505" y="166" width="405" height="118"
         xlink:href="chillscript-wordmark.png"
         preserveAspectRatio="xMidYMid meet"
         filter="url(#wordmarkShadow)"/>
</svg>
