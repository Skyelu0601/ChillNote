name: Android Google Play release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "用户看到的版本号，例如 1.3.0"
        required: true
        default: "1.2.10"
        type: string
      version_code:
        description: "Google Play 未使用过的递增整数，例如 9"
        required: true
        default: "9"
        type: string
      track:
        description: "发布轨道"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "completed 会立即提交到所选轨道；draft 只创建草稿"
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
      confirmation:
        description: "仅生产轨道需要：草稿填 PRODUCTION-版本号，正式发布填 RELEASE-版本号"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload ${{ inputs.version_name }} (${{ inputs.version_code }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.track == 'production' && 'google-play-production' || 'google-play-testing' }}
    env:
      CHILLSCRIPT_VERSION_CODE: ${{ inputs.version_code }}
      CHILLSCRIPT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      CHILLSCRIPT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      CHILLSCRIPT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      CHILLSCRIPT_FIREBASE_API_KEY: ${{ secrets.CHILLSCRIPT_FIREBASE_API_KEY }}
      CHILLSCRIPT_FIREBASE_APP_ID: ${{ secrets.CHILLSCRIPT_FIREBASE_APP_ID }}
      CHILLSCRIPT_FIREBASE_PROJECT_ID: ${{ secrets.CHILLSCRIPT_FIREBASE_PROJECT_ID }}
      CHILLSCRIPT_FIREBASE_SENDER_ID: ${{ secrets.CHILLSCRIPT_FIREBASE_SENDER_ID }}
      CHILLSCRIPT_REVENUECAT_ANDROID_API_KEY: ${{ secrets.CHILLSCRIPT_REVENUECAT_ANDROID_API_KEY }}
      CHILLSCRIPT_ANDROID_AUTH_REDIRECT_URI: ${{ secrets.CHILLSCRIPT_ANDROID_AUTH_REDIRECT_URI }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version_name 必须类似 1.3.0"
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code 必须是正整数"
            exit 1
          }
          if [[ "$TRACK" == "production" ]]; then
            if [[ "$RELEASE_STATUS" == "completed" ]]; then
              expected="RELEASE-$VERSION_CODE"
            else
              expected="PRODUCTION-$VERSION_CODE"
            fi
            [[ "$CONFIRMATION" == "$expected" ]] || {
              echo "生产轨道确认词不正确，应填写 $expected"
              exit 1
            }
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: store

      - name: Prepare protected credentials
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          required=(
            UPLOAD_KEYSTORE_BASE64
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            CHILLSCRIPT_UPLOAD_STORE_PASSWORD
            CHILLSCRIPT_UPLOAD_KEY_ALIAS
            CHILLSCRIPT_UPLOAD_KEY_PASSWORD
            CHILLSCRIPT_REVENUECAT_ANDROID_API_KEY
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || {
              echo "缺少 GitHub Secret: $name"
              exit 1
            }
          done

          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chillscript-upload-key.jks"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          python3 -m json.tool "$RUNNER_TEMP/google-play-service-account.json" > /dev/null

          {
            echo "CHILLSCRIPT_UPLOAD_STORE_FILE=$RUNNER_TEMP/chillscript-upload-key.jks"
            echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/google-play-service-account.json"
          } >> "$GITHUB_ENV"

      - name: Validate Android localizations
        run: python3 android/scripts/validate_localizations.py

      - name: Test and build signed App Bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./gradlew testReleaseUnitTest bundleRelease \
            -PchillscriptVersionCode="$VERSION_CODE" \
            -PchillscriptVersionName="$VERSION_NAME"

      - name: Upload App Bundle to Google Play
        working-directory: store/google-play
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          bundle exec fastlane android upload_ci_release \
            version_code:"$VERSION_CODE" \
            track:"$RELEASE_TRACK" \
            release_status:"$RELEASE_STATUS" \
            confirm:"$RELEASE_CONFIRMATION"

      - name: Keep signed bundle as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chillscript-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14
